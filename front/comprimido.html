<!DOCTYPE html>
<html lang="es" data-soporte="papel">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tres Estudios Abiertos — Archivo Comprimido</title>
    <link rel="stylesheet" href="/tokens.css">
    <link rel="stylesheet" href="/comprimido.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono&family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
    <script type="importmap">
        {
            "imports": {
                "treslib/GrainEngine":  "https://cdn.jsdelivr.net/npm/treslib@1.12.0/src/GrainEngine.js",
                "treslib/SnapToGrains": "https://cdn.jsdelivr.net/npm/treslib@1.12.0/src/SnapToGrains.js"
            }
        }
    </script>
</head>
<body>
    <header id="barra">
        <div id="barra-titulo">
            <span class="eyebrow">TRES ESTUDIOS ABIERTOS</span>
            <span class="sub">archivo comprimido · parte III</span>
        </div>
        <div id="barra-controles">
            <select id="sel-receta" title="Receta"></select>
            <input id="inp-semilla" type="number" min="1" max="9999" title="Semilla">
            <button id="btn-render" title="Renderizar con esta semilla">renderizar</button>
            <button id="btn-regenerar" title="Nueva instancia (semilla nueva)">regenerar</button>
            <button id="btn-audio" title="Granulación sobre el snapshot del panel visible">sonido: no</button>
            <button id="btn-grabar" title="Anota tus decisiones —qué suena, cuándo— y al detener las convierte en un mp3 de hasta 10 min">grabar</button>
            <span id="grabar-estado" aria-live="polite"></span>
            <button id="btn-receta" title="Escribe tu propia receta y descarga tu cuadernillo">escribir receta</button>
        </div>
    </header>

    <!-- Receta de visitante: los controles escriben la receta en el texto de
         abajo, que se muestra pero no se edita. No se publica ni se guarda. -->
    <aside id="receta" hidden>
        <div class="receta-cabeza">
            <span class="eyebrow">TU RECETA</span>
            <button id="receta-cerrar" title="Cerrar" aria-label="cerrar receta">×</button>
        </div>
        <p class="receta-nota">Elige los parámetros; abajo se escribe tu receta. Tu cuadernillo no se publica ni se guarda: sólo se descarga.</p>

        <label>título
            <input id="r-titulo" type="text" maxlength="80" placeholder="Mi caminata">
        </label>
        <label>nota inicial
            <select id="r-desde"></select>
        </label>
        <!-- Vista previa de la nota inicial: el principio de la nota tal cual,
             sin reescribir. -->
        <div id="r-previa" aria-live="polite"></div>
        <div class="receta-fila">
            <label>formato
                <select id="r-formato">
                    <option value="zine8">zine de 8</option>
                    <option value="mapa">mapa desplegable</option>
                </select>
            </label>
            <label>pasos
                <input id="r-pasos" type="number" min="2" max="8" value="6">
            </label>
            <label>recorte
                <input id="r-recorte" type="number" min="10" max="150" value="50">
            </label>
        </div>
        <fieldset>
            <legend>camina por</legend>
            <label class="opcion"><input type="radio" name="r-afinidad" value="termino" checked> palabras compartidas</label>
            <label class="opcion"><input type="radio" name="r-afinidad" value="enlace"> enlaces del documento</label>
        </fieldset>
        <fieldset>
            <legend>código</legend>
            <label class="opcion"><input type="radio" name="r-codigo" value="incluir" checked> incluir</label>
            <label class="opcion"><input type="radio" name="r-codigo" value="evitar"> evitar</label>
            <label class="opcion"><input type="radio" name="r-codigo" value="solo"> sólo código</label>
        </fieldset>
        <fieldset>
            <legend>que no falte</legend>
            <label class="opcion"><input type="checkbox" name="r-cobertura" value="prosa"> prosa</label>
            <label class="opcion"><input type="checkbox" name="r-cobertura" value="codigo"> código</label>
            <label class="opcion"><input type="checkbox" name="r-cobertura" value="imagen"> imagen</label>
        </fieldset>
        <fieldset>
            <legend>epígrafe</legend>
            <label class="opcion"><input type="radio" name="r-epigrafe" value="anti" checked> una frase de anti</label>
            <label class="opcion"><input type="radio" name="r-epigrafe" value="propio"> escribo el mío</label>
            <label class="opcion"><input type="radio" name="r-epigrafe" value="ninguno"> sin epígrafe</label>
            <textarea id="r-portada" maxlength="400" rows="3" placeholder="tu epígrafe" hidden></textarea>
        </fieldset>
        <label>semilla <span class="receta-nota">(vacía = al azar)</span>
            <input id="r-semilla" type="number" min="1" max="9999">
        </label>

        <label>la receta
            <textarea id="r-texto" rows="12" spellcheck="false" readonly></textarea>
        </label>

        <div class="receta-acciones">
            <button id="r-ver">ver</button>
            <button id="r-pdf">descargar pdf</button>
        </div>
        <div id="r-estado" class="receta-nota" aria-live="polite"></div>
    </aside>

    <main id="tira">
        <div id="estado">cargando instancia…</div>
    </main>

    <script type="module" src="/comprimido.js"></script>
</body>
</html>
